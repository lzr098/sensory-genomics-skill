subsystems:
- name: vision
  display_name: 视觉系统
  genes:
  - symbol: OPN1LW
    function: 长波长视蛋白（红敏色素），色觉三色视觉的关键基因
  - symbol: OPN1MW
    function: 中波长视蛋白（绿敏色素），色觉三色视觉的关键基因
  - symbol: OPN1SW
    function: 短波长视蛋白（蓝敏色素），负责蓝紫光感知
  - symbol: RHO
    function: 视紫红质，杆状细胞光信号传导的关键蛋白
  - symbol: PDE6A
    function: 磷酸二酯酶6A，光传导级联反应的效应酶
  - symbol: ABCA4
    function: 视网膜色素上皮细胞转运蛋白，与黄斑变性相关
  - symbol: EYS
    function: 视网膜感光细胞外节结构蛋白，与视网膜色素变性相关
  - symbol: GJA8
    function: 缝隙连接蛋白，晶状体发育与透明性维持
  - symbol: CRYAA
    function: 晶状体 alpha-A 晶体蛋白，维持晶状体透明度
  - symbol: OCA2
    function: 黑色素体膜转运蛋白，影响虹膜色素沉着与视力
  - symbol: TYRP1
    function: 酪氨酸酶相关蛋白1，黑色素合成通路
- name: hearing
  display_name: 听觉系统
  genes:
  - symbol: GJB2
    function: 缝隙连接蛋白 Connexin-26，耳蜗钾离子循环的关键蛋白
  - symbol: GJB6
    function: 缝隙连接蛋白 Connexin-30，与 GJB2 协同维持内耳稳态
  - symbol: MYO7A
    function: 非传统肌球蛋白 VIIa，毛细胞静纤毛发育与维持
  - symbol: CDH23
    function: 钙黏蛋白23，毛细胞尖端链接结构蛋白
  - symbol: OTOF
    function: Otoferlin，内毛细胞突触囊泡释放的关键蛋白
  - symbol: CABP2
    function: 钙结合蛋白2，调节内毛细胞钙信号与突触传递
  - symbol: SLC26A4
    function: pendrin 阴离子交换蛋白，内耳内淋巴液离子平衡
  - symbol: KCNQ4
    function: 钾离子通道，外毛细胞电机械转导与稳态
  - symbol: MT-RNR1
    function: 线粒体12S核糖体RNA，氨基糖苷类抗生素致聋靶点
  - symbol: MT-TS1
    function: 线粒体丝氨酸tRNA，与非综合征性耳聋相关
