  - symbol: GRPR
    function: 胃泌素释放肽受体，脊髓水平瘙痒信号传导
  - symbol: IL31RA
    function: 白细胞介素31受体，瘙痒信号与特应性皮炎相关
  - symbol: OPRM1
    function: μ-阿片受体，痛觉调制与愉悦感传导
  - symbol: COMT
    function: 儿茶酚-O-甲基转移酶，多巴胺与肾上腺素代谢，影响痛觉敏感性
